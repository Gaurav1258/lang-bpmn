# =============================================================================
# Google Cloud Build CI/CD Pipeline
# AgentBPMN (lang-bpmn) - Enterprise Process Orchestration & Studio
# Target: Google Cloud Run (us-central1) on GCP Project mlops2215
# =============================================================================
steps:
  # ---------------------------------------------------------------------------
  # Step 1: Strict Unit & Compiler Quality Gate
  # ---------------------------------------------------------------------------
  - name: 'python:3.11-slim'
    id: 'stage-1-unit-tests-quality-gate'
    entrypoint: 'bash'
    env:
      - 'GCP_PROJECT_ID=$PROJECT_ID'
      - 'GCP_REGION=$_REGION'
    args:
      - '-c'
      - |
        set -e
        echo "============================================================"
        echo "STAGE 1: RUNNING FULL AGENT-BPMN QUALITY GATE"
        echo "============================================================"
        pip install --no-cache-dir uv
        uv pip install --system ".[dev,engine]"
        python -m pytest tests/ -v --tb=short
        echo ">>> STAGE 1 PASSED: All architectural tests verified."

  # ---------------------------------------------------------------------------
  # Step 2: Build Production Docker Container (FastAPI + React Studio SPA)
  # ---------------------------------------------------------------------------
  - name: 'gcr.io/cloud-builders/docker'
    id: 'stage-2-build-container-image'
    args:
      - 'build'
      - '-t'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/agent-bpmn:latest'
      - '-t'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/agent-bpmn:$COMMIT_SHA'
      - '-t'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/agent-bpmn:$BUILD_ID'
      - '-f'
      - 'Dockerfile'
      - '.'

  # ---------------------------------------------------------------------------
  # Step 3: Push Container Image to GCP Artifact Registry
  # ---------------------------------------------------------------------------
  - name: 'gcr.io/cloud-builders/docker'
    id: 'stage-3-push-image-to-registry'
    args:
      - 'push'
      - '--all-tags'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/agent-bpmn'

  # ---------------------------------------------------------------------------
  # Step 4: Publish Python Package (Wheel & Sdist) to GCP Artifact Registry
  # ---------------------------------------------------------------------------
  - name: 'python:3.11-slim'
    id: 'stage-4-publish-python-package'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        echo "============================================================"
        echo "STAGE 4: PUBLISHING AGENT-BPMN PYTHON PACKAGE TO ARTIFACT REGISTRY"
        echo "============================================================"
        pip install --no-cache-dir build twine keyring keyrings.google-artifactregistry-auth
        python -m build
        twine upload --repository-url https://$_REGION-python.pkg.dev/$PROJECT_ID/$_PYTHON_REPO_NAME/ dist/* --skip-existing || true
        echo ">>> Published agent-bpmn to https://$_REGION-python.pkg.dev/$PROJECT_ID/$_PYTHON_REPO_NAME/"

  # ---------------------------------------------------------------------------
  # Step 5: Deploy to Google Cloud Run (agent-bpmn)
  # ---------------------------------------------------------------------------
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'stage-5-deploy-to-cloud-run'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '$_SERVICE_NAME'
      - '--image=$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/agent-bpmn:latest'
      - '--region=$_REGION'
      - '--platform=managed'
      - '--memory=1Gi'
      - '--port=8080'
      - '--allow-unauthenticated'
      - '--set-env-vars=GCP_PROJECT_ID=$PROJECT_ID,GCP_REGION=$_REGION,ENVIRONMENT=production'

# Images registered in Artifact Registry (automatically pushed on each run)
images:
  - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/agent-bpmn:latest'
  - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/agent-bpmn:$COMMIT_SHA'
  - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/agent-bpmn:$BUILD_ID'

substitutions:
  _REGION: 'us-central1'
  _REPO_NAME: 'scf-repo'
  _PYTHON_REPO_NAME: 'scf-python-repo'
  _SERVICE_NAME: 'agent-bpmn'

options:
  logging: CLOUD_LOGGING_ONLY

timeout: '1200s'
