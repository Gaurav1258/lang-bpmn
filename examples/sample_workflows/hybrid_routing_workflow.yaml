version: "1.0"
metadata:
  id: "hybrid_invoice_routing_flow"
  name: "Enterprise Hybrid Invoice Routing (DMN Decision Table)"
  version: "1.2.0"
  description: "Orchestrates invoice extraction and sanctions screening, followed by a deterministic DMN Decision Table that routes to either auto-settlement or emergency compliance review."
  owner_department: "Finance & Compliance"

guardrails:
  max_total_budget_usd: 0.25
  workflow_timeout_seconds: 1800
  max_loop_iterations: 3

nodes:
  - id: "extract_invoice"
    type: "block"
    name: "Extract Invoice Line Items"
    block: "finance.invoice_extractor"
    input_mapping:
      document_url: "$invoice_pdf_url"
      vendor_tax_id: "$tax_id"
    output_mapping:
      invoice_number: "invoice_number"
      vendor_name: "vendor_name"
      total_amount_usd: "invoice_total_usd"
      line_items: "extracted_line_items"

  - id: "screen_sanctions"
    type: "block"
    name: "Screen Counterparty Against Sanctions"
    block: "compliance.sanctions_screener"
    input_mapping:
      entity_name: "$vendor_name"
      country_code: "US"
      transaction_amount_usd: "$invoice_total_usd"
    output_mapping:
      is_flagged: "sanctions_is_flagged"
      risk_score: "sanctions_risk_score"
      compliance_note: "sanctions_note"

  - id: "risk_decision_table"
    type: "dmn_table"
    name: "Compliance & Risk DMN Table"
    dmn_config:
      hit_policy: "FIRST_MATCH"
      rules:
        # High Risk Branch
        - condition: "sanctions_is_flagged == true or sanctions_risk_score >= 0.7"
          target: "emergency_compliance_review"
          description: "Route to L2 Compliance Review if sanctions watchlist hit or risk score >= 0.7"

        # High Dollar Amount Branch
        - condition: "invoice_total_usd > 50000.0"
          target: "emergency_compliance_review"
          description: "Route to Executive Review if invoice exceeds $50,000 threshold"

        # Low Risk / Standard Amount Branch (Default)
        - target: "auto_payment_settlement"
          description: "Auto-approve and settle clean invoices under $50,000"

  - id: "emergency_compliance_review"
    type: "block"
    name: "L2 Sanctions Investigation"
    block: "compliance.emergency_review"
    input_mapping:
      entity_name: "$vendor_name"
      risk_score: "$sanctions_risk_score"
      flag_reason: "$sanctions_note"
    output_mapping:
      case_docket_id: "review_docket_id"
      status: "workflow_final_status"

  - id: "auto_payment_settlement"
    type: "block"
    name: "Automated Payment Settlement"
    block: "finance.auto_settlement"
    input_mapping:
      invoice_number: "$invoice_number"
      amount_usd: "$invoice_total_usd"
      vendor_name: "$vendor_name"
    output_mapping:
      transaction_id: "settlement_txn_id"
      status: "workflow_final_status"

edges:
  - source: "START"
    target: "extract_invoice"
  - source: "extract_invoice"
    target: "screen_sanctions"
  - source: "screen_sanctions"
    target: "risk_decision_table"
  - source: "emergency_compliance_review"
    target: "END"
  - source: "auto_payment_settlement"
    target: "END"

